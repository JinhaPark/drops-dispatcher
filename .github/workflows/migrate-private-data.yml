name: Migrate private content (no Discord sends)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drops-private-data-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Generate short-lived private repository token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DROPS_APP_ID }}
          private-key: ${{ secrets.DROPS_APP_PRIVATE_KEY }}
          owner: JinhaPark
          repositories: drops
          permission-contents: write
      - name: Checkout private destination
        uses: actions/checkout@v4
        with:
          repository: JinhaPark/drops
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: private-data
          persist-credentials: true
          fetch-depth: 1
      - name: Copy cache and state without overwriting divergent files
        run: python3 scripts/migrate_private_data.py . private-data
      - name: Commit private snapshot
        working-directory: private-data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- articles/ data/
          if test -d reports; then git add -- reports/; fi
          if test -f sources.json; then git add -- sources.json; fi
          if git diff --cached --quiet; then
            echo "No changes to private data"
          else
            git commit -m "chore: migrate private article cache and delivery checkpoints"
            git push origin HEAD:main
          fi
