name: Private-backed Discord delivery
on:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/discord-feed.yml'
      - 'scripts/**'
      - 'tests/**'
      - '.agents/skills/discord-feed/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation only or manual delivery'
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deliver
permissions:
  contents: read
concurrency:
  group: drops-private-delivery-ledger
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public delivery code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate to private data repository
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DROPS_APP_ID }}
          private-key: ${{ secrets.DROPS_APP_PRIVATE_KEY }}
          owner: JinhaPark
          repositories: drops
          permission-contents: write
      - name: Verify private installation access
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo=$(gh api repos/JinhaPark/drops --jq '.full_name')
          test "$repo" = 'JinhaPark/drops'
          access=$(gh api installation/repositories --jq '.repositories[] | select(.full_name == "JinhaPark/drops") | .full_name')
          test "$access" = 'JinhaPark/drops' || { echo "::error::GitHub App installation token does not include private drops"; exit 1; }
          echo "Installation token confirmed for private drops"
      - name: Checkout private data (no credentials persisted)
        uses: actions/checkout@v4
        with:
          repository: JinhaPark/drops
          token: ${{ steps.app-token.outputs.token }}
          path: private-data
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public delivery scripts into temporary private checkout
        run: |
          mkdir -p private-data/scripts private-data/.agents/skills
          cp -a scripts/. private-data/scripts/
          cp -a .agents/skills/discord-feed private-data/.agents/skills/
          cp -a tests private-data/tests
      - name: Validate readiness without sending messages
        shell: bash
        run: |
          set -euo pipefail
          test -f private-data/data/monitor-state.json
          test -f private-data/data/discord-deliveries.json
          test -d private-data/articles
          test ! -s private-data/data/discord-backfill-inflight.json || python -c 'import json; assert not json.load(open("private-data/data/discord-backfill-inflight.json"))'
          (cd private-data && python -m unittest discover -s tests -v)
          echo "Private checkout and focused tests passed."

      - name: Deliver approved private Markdown (explicit opt-in only)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver') }}
        working-directory: private-data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK_URL"
          gh auth setup-git
          python scripts/deliver_articles.py
