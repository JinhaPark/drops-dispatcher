name: Private-backed Discord delivery
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validation only or manually approved delivery'
        required: true
        type: choice
        default: validate
        options:
          - validate
          - deliver
permissions:
  contents: read
concurrency:
  group: drops-private-delivery-ledger
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public delivery code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate short-lived private repository token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.DROPS_APP_ID }}
          private-key: ${{ secrets.DROPS_APP_PRIVATE_KEY }}
          owner: JinhaPark
          repositories: drops
          permission-contents: write
      - name: Read private Markdown and ledger via GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/private_repo.py pull --branch main --destination private-data --groups articles data sources
      - name: Install dispatcher code into ephemeral data workspace
        run: |
          mkdir -p private-data/scripts private-data/.agents/skills
          cp -a scripts/. private-data/scripts/
          cp -a tests private-data/tests
          cp -a .agents/skills/discord-feed private-data/.agents/skills/
      - name: Validate delivery safeguards
        shell: bash
        run: |
          set -euo pipefail
          test -f private-data/data/monitor-state.json
          test -f private-data/data/discord-deliveries.json
          test -d private-data/articles
          python - <<'PY'
          import json
          from pathlib import Path
          marker = Path('private-data/data/discord-backfill-inflight.json')
          assert not marker.exists() or not json.loads(marker.read_text()), "In-flight delivery requires reconciliation"
          PY
          (cd private-data && python -m unittest discover -s tests -v)
          echo "Private API snapshot and focused tests passed; validation mode never posts."
      - name: Deliver approved Markdown with atomic private checkpoints
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'deliver') }}
        shell: bash
        working-directory: private-data
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DROPS_PRIVATE_REST: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          test -n "$DISCORD_WEBHOOK_URL"
          python scripts/deliver_articles.py
