name: Deliver approved Markdown to Discord
on:
  push:
    branches: [main]
    paths:
      - 'articles/**/*.md'
      - 'data/artificial-engineering-backfill.json'
      - 'data/chronological-backfill.json'
      - 'data/one-time-preview-20261023.json'
      - 'data/devansh-recent-five-20261024.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: discord-feed-ledger
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh main after acquiring concurrency slot
        run: git pull --ff-only origin main
      - name: Validate local delivery skill
        run: |
          python -m unittest discover -s .agents/skills/discord-drops/tests -v
          python -m unittest discover -s tests -v
          python scripts/backfill.py --validate-only
          python scripts/chronological_backfill.py --validate-only
          python scripts/one_time_preview.py --validate-only
          python scripts/devansh_recent_five.py --validate-only
      - name: Configure checkpoint author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Deliver ready articles
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "DISCORD_WEBHOOK_URL is missing in news Actions secrets"; exit 1; fi
          python scripts/deliver_articles.py
      # Live and backfill both commit and verify each article on remote main.
      # Never bulk-push the local ledger after a failed/uncertain delivery.
      - name: Preserve ledger evidence after failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: discord-ledger-${{ github.run_id }}
          path: |
            data/discord-deliveries.json
            data/discord-backfill-inflight.json
