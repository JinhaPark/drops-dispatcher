name: Validate Discord delivery safeguards
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-discord.yml'
      - '.github/workflows/discord-feed.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Discord route secrets exist without disclosing them
        shell: bash
        env:
          AI_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINANCE_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_FINANCE }}
          GENERAL_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL_GENERAL }}
        run: |
          set -euo pipefail
          if [[ -z "$AI_WEBHOOK" ]]; then echo "::error::Missing DISCORD_WEBHOOK_URL"; exit 1; fi
          if [[ -z "$FINANCE_WEBHOOK" ]]; then echo "::error::Missing DISCORD_WEBHOOK_URL_FINANCE"; exit 1; fi
          if [[ -z "$GENERAL_WEBHOOK" ]]; then echo "::error::Missing DISCORD_WEBHOOK_URL_GENERAL"; exit 1; fi
          echo "Three Discord route credentials are configured; values not logged"
      - name: Mint private contents read token
        uses: actions/create-github-app-token@v2
        id: private-token
        with:
          app-id: ${{ secrets.DROPS_APP_ID }}
          private-key: ${{ secrets.DROPS_APP_PRIVATE_KEY }}
          owner: JinhaPark
          repositories: drops
          permission-contents: read
      - name: Read private fixture snapshot via GitHub API
        env:
          GH_TOKEN: ${{ steps.private-token.outputs.token }}
        run: python scripts/private_repo.py pull --destination private-data --groups articles data sources --read-only-snapshot
      - name: Test against verified private fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-data/.agents/skills private-data/scripts
          cp -a scripts/. private-data/scripts/
          cp -a tests private-data/tests
          mkdir -p private-data/.github/workflows
          cp .github/workflows/report-feed.yml private-data/.github/workflows/report-feed.yml
          cp -a .agents/skills/discord-feed private-data/.agents/skills/
          cd private-data
          python -m unittest discover -s .agents/skills/discord-feed/tests -v
          python -m unittest discover -s tests -v
          python scripts/backfill.py --validate-only
          python scripts/chronological_backfill.py --validate-only
          python scripts/devansh_recent_five.py --validate-only
