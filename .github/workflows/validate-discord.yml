name: Validate Discord delivery safeguards
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.agents/skills/discord-feed/**'
      - '.github/workflows/**'
      - 'articles/artificial-engineering/**'
      - 'data/artificial-engineering-backfill.json'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'data/artificial-engineering-backfill.json'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .agents/skills/discord-feed/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python scripts/backfill.py --validate-only
