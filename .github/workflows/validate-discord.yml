name: Validate Discord delivery safeguards
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/validate-discord.yml'
      - '.github/workflows/discord-feed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@v2
        id: private-token
        with:
          app-id: ${{ secrets.DROPS_APP_ID }}
          private-key: ${{ secrets.DROPS_APP_PRIVATE_KEY }}
          owner: JinhaPark
          repositories: drops
          permission-contents: read
      - uses: actions/checkout@v4
        with:
          repository: JinhaPark/drops
          token: ${{ steps.private-token.outputs.token }}
          path: private-data
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private-backed dispatcher without Discord
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-data/.agents/skills
          cp -a scripts tests private-data/
          cp -a .agents/skills/discord-feed private-data/.agents/skills/
          cd private-data
          python -m unittest discover -s .agents/skills/discord-feed/tests -v
          python -m unittest discover -s tests -v
          python scripts/backfill.py --validate-only
          python scripts/chronological_backfill.py --validate-only
          python scripts/devansh_recent_five.py --validate-only
