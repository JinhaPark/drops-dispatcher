name: Offline Discord checkpoint tests
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/checkpoint-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Isolated offline delivery skill tests
        run: |
          python -m unittest discover -s .agents/skills/discord-feed/tests -v
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p test_private_reports.py -v
          python -m unittest discover -s tests -p test_private_youtube.py -v
          python -m unittest discover -s tests -p test_event_driven_dispatch.py -v
          python -m unittest discover -s tests -p test_retire_old_report_branch.py -v
          python -m unittest discover -s tests -p test_verify_discord_routes.py -v
          python -m unittest discover -s tests -p test_private_repo.py -v
          python -m unittest discover -s tests -p test_private_migration.py -v
          python -m unittest discover -s tests -p test_live_checkpoints.py -v

