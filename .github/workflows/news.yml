name: News collection and publishing
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/articles.json'
      - 'sources.json'
      - 'scripts/**'
      - '.github/workflows/news.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: news-pipeline
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect new items into editorial queue
        run: python scripts/news.py fetch
      - name: Build validated site and RSS
        run: python scripts/news.py build
      - name: Deploy Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Notify Discord after successful deploy
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/news.py notify
      - name: Persist collection and notification state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: persist news processing state'
            git push
          fi
